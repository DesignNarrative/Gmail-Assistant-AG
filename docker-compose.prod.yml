version: '3.9'

# =============================================================================
# InboxIQ — Production Docker Compose Configuration
# =============================================================================

networks:
  inboxiq_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension (Internal Only — No Host Ports)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: inboxiq_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inboxiq}
      POSTGRES_USER: ${POSTGRES_USER:-inboxiq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - inboxiq_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inboxiq_admin} -d ${POSTGRES_DB:-inboxiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache + Broker (Internal Only — No Host Ports)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: inboxiq_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password must be set in .env}
    volumes:
      - redis_data:/data
    networks:
      - inboxiq_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend (Production Multi-worker Mode)
  # ---------------------------------------------------------------------------
  backend:
    image: inboxiq_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: inboxiq_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-inboxiq_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inboxiq}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GMAIL_LABEL=${GMAIL_LABEL:-InboxIQ}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - DEBUG=false
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - inboxiq_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Celery Worker — Document OCR & Vector Embeddings Background Tasks
  # ---------------------------------------------------------------------------
  celery_worker:
    image: inboxiq_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: inboxiq_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q default,email_sync,ocr,embeddings
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-inboxiq_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inboxiq}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GMAIL_LABEL=${GMAIL_LABEL:-InboxIQ}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - inboxiq_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Nginx Gateway (TLS & Static Asset Proxy)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: inboxiq_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - inboxiq_network
    depends_on:
      - backend
