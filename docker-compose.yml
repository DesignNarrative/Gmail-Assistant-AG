version: '3.9'

# =============================================================================
# Abhinav Group — AI Gmail Intelligence Assistant
# Docker Compose — Development Environment
# =============================================================================

networks:
  abhinav_ai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: abhinav_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abhinav_ai}
      POSTGRES_USER: ${POSTGRES_USER:-abhinav_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - abhinav_ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abhinav_admin} -d ${POSTGRES_DB:-abhinav_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 — Task queue broker + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: abhinav_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - abhinav_ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    image: abhinav_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: abhinav_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-abhinav_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-abhinav_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/callback}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GMAIL_LABEL=${GMAIL_LABEL:-Director's AI Assistant}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - DEBUG=true
      - FIRST_DIRECTOR_EMAIL=${FIRST_DIRECTOR_EMAIL:-}
      - FIRST_DIRECTOR_NAME=${FIRST_DIRECTOR_NAME:-}
      - FIRST_DIRECTOR_PASSWORD=${FIRST_DIRECTOR_PASSWORD:-}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "8000:8000"
    networks:
      - abhinav_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Celery Worker — Background task processor
  # ---------------------------------------------------------------------------
  celery_worker:
    image: abhinav_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: abhinav_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q default,email_sync,ocr,embeddings
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-abhinav_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-abhinav_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/callback}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GMAIL_LABEL=${GMAIL_LABEL:-Director's AI Assistant}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - abhinav_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Beat — Scheduled task scheduler
  # ---------------------------------------------------------------------------
  celery_beat:
    image: abhinav_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: abhinav_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-abhinav_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-abhinav_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/callback}
      - GMAIL_LABEL=${GMAIL_LABEL:-Director's AI Assistant}
    volumes:
      - ./backend:/app
      - logs_data:/app/logs
    networks:
      - abhinav_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Flower — Celery task monitoring (dev only)
  # ---------------------------------------------------------------------------
  flower:
    image: abhinav_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: abhinav_flower
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-abhinav_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-abhinav_ai}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION}
    ports:
      - "5555:5555"
    networks:
      - abhinav_ai_network
    depends_on:
      - redis
      - celery_worker

  # ---------------------------------------------------------------------------
  # React Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: abhinav_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - abhinav_ai_network
    depends_on:
      - backend
